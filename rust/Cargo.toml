[package]
name = "nya_core"
version = "1.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3"] }
anyhow = "1"
log = "0.4"
biquad = "0.6"
lofty = "0.25"
encoding_rs = "0.8"

# cpal's AAudio backend needs the Android Context; see src/android_context.rs.
# Both are already in the tree through cpal (same versions).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
